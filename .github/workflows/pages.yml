# Build and publish the PWA to GitHub Pages so it can be tested on a phone
# over HTTPS (iOS needs a secure context for the service worker,
# navigator.share and the DeviceOrientation permission prompt).
#
# A project site is served from https://<owner>.github.io/<repo>/, so the
# build gets VITE_BASE=/<repo>/ (see vite.config.js). Pages must be enabled
# with Source = "GitHub Actions"; configure-pages tries to do that itself.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The `playwright` package would otherwise download browsers on npm ci.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (ReScript build + vitest)
        run: npm test
      - name: Build for the project-site subpath
        run: VITE_BASE="/${{ github.event.repository.name }}/" npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
