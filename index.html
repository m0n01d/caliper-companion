<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#15181D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- `default`, not `black-translucent`: iOS 26/27 paints its own Liquid Glass
       scroll-edge blur over the top of a home-screen web app that combines
       black-translucent with viewport-fit=cover (no CSS or meta switch turns it
       off), which smeared the nav bar under the Dynamic Island. An opaque status
       bar in theme-color removes the band; safe-area-inset-top then reads 0 in
       standalone, and the bottom inset still comes from viewport-fit=cover. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Caliper Companion</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/src/theme.css" />
  <link rel="stylesheet" href="/src/global.css" />
  <link rel="stylesheet" href="/src/app/pages/PartsList.css" />

  <link rel="stylesheet" href="/src/app/pages/Capture.css" />
  <link rel="stylesheet" href="/src/app/pages/Annotate.css" />
  <link rel="stylesheet" href="/src/app/pages/Settings.css" />
  <link rel="stylesheet" href="/src/app/pages/Debug.css" />
  <link rel="stylesheet" href="/src/app/export/Export.css" />
</head>
<body>

  <script type="module" src="/src/app/Index.res.mjs"></script>
</body>
</html>
