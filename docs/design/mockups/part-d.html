<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Part · D · Segmented</title>
<!-- Mockup for docs/design/review-2026-09-17.md. Real app CSS + real fixture
     images; only the layout below is new. Tap the segmented control (or open
     with ?pane=features) to switch panes. -->
<link rel="stylesheet" href="../../../src/theme.css">
<link rel="stylesheet" href="../../../src/global.css">
<style>
  /* ── Layout D: Faces / Features panes under a segmented control; Export docked ── */
  .shell-content { display: flex; flex-direction: column; }
  .pane-stack { display: flex; flex-direction: column; gap: var(--cc-space-4); }
  [hidden] { display: none !important; }

  /* faces pane = A's grid */
  .face-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--cc-space-4); }
  .face-card { position: relative; display: block; aspect-ratio: 1; border-radius: var(--cc-radius-card); background: var(--cc-surface-2); overflow: hidden; color: inherit; text-decoration: none; touch-action: manipulation; }
  .face-card:active { opacity: 0.6; }
  .face-card img { width: 100%; height: 100%; object-fit: cover; }
  .face-card-captured::after { content: ""; position: absolute; inset: 0; pointer-events: none; border: 2px solid var(--cc-teal); border-radius: inherit; }
  .face-card-scrim { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 1px; padding: 36px 12px 10px; background: linear-gradient(to top, rgba(26, 27, 29, 0.94) 0 44px, rgba(26, 27, 29, 0)); }
  .face-card-label { font: var(--cc-text-headline); text-transform: capitalize; }
  .face-card-meta  { font: var(--cc-text-caption-1); color: var(--cc-text-2); font-variant-numeric: tabular-nums; }
  .face-card-check { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--cc-teal); color: var(--cc-ground); }
  .face-card-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--cc-space-2); background: transparent; border: 2px dashed var(--cc-border); color: var(--cc-text-2); font: 600 var(--cc-size-subhead) / var(--cc-leading-subhead) var(--cc-font-ui); }
  .face-card-empty svg { width: 28px; height: 28px; }

  /* features pane = B's rows */
  .value-row { display: flex; align-items: center; gap: var(--cc-space-3); padding: 12px 16px; min-height: 70px; }
  .value-row + .value-row { border-top: 1px solid var(--cc-border); margin-left: 16px; padding-left: 0; }
  .value-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .value-name { font: 500 var(--cc-size-body) / var(--cc-leading-body) var(--cc-font-mono); overflow-wrap: anywhere; }
  .value-faces { font: var(--cc-text-footnote); color: var(--cc-text-2); }
  .value-faces-multi { color: var(--cc-teal); }
  .value-nums { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; }
  .value-val { font: 400 22px / 28px var(--cc-font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .value-val .unit { font: var(--cc-text-subhead); color: var(--cc-text-2); margin-left: 4px; }
  .value-tol { font: 400 var(--cc-size-footnote) / var(--cc-leading-footnote) var(--cc-font-mono); color: var(--cc-text-2); }
  .flag { display: inline-flex; color: var(--cc-error); vertical-align: -3px; margin-right: 4px; }
  .flag svg { width: 16px; height: 16px; }

  /* docked action: sticky inside the scroll container (never fixed), opaque */
  .action-dock {
    position: sticky; bottom: 0; margin-top: auto;
    margin-left: calc(-1 * (var(--cc-page-x) + env(safe-area-inset-left)));
    margin-right: calc(-1 * (var(--cc-page-x) + env(safe-area-inset-right)));
    margin-bottom: calc(-1 * (var(--cc-space-5) + env(safe-area-inset-bottom)));
    padding: var(--cc-space-3) calc(var(--cc-page-x) + env(safe-area-inset-right)) calc(var(--cc-space-3) + env(safe-area-inset-bottom)) calc(var(--cc-page-x) + env(safe-area-inset-left));
    background: var(--cc-ground); border-top: 1px solid var(--cc-border);
    display: flex; flex-direction: column; gap: var(--cc-space-2);
  }
  .pane-stack { padding-bottom: var(--cc-space-6); }
  .timer { text-align: center; }
  .bar-action { min-height: var(--cc-tap-min); padding: 0 var(--cc-space-2); background: transparent; border-color: transparent; color: var(--cc-amber); font: var(--cc-text-body); }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="root"><div class="app-frame"><div class="shell">
  <header class="shell-topbar">
    <div class="shell-topbar-leading">
      <button class="btn btn-icon shell-back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <div class="shell-topbar-center">
      <h1 class="shell-title">Norcold freezer hinge pin</h1>
      <p class="shell-subtitle">mm · Hands-on 3m 07s</p>
    </div>
    <div class="shell-topbar-actions"><button class="btn bar-action">Edit</button></div>
  </header>

  <main class="shell-content">
    <div class="pane-stack">
      <div class="segmented" role="tablist" aria-label="Part sections">
        <button class="segmented-option" role="tab" id="tab-faces" aria-pressed="true" aria-controls="pane-faces">Faces · 3</button>
        <button class="segmented-option" role="tab" id="tab-features" aria-pressed="false" aria-controls="pane-features">Features · 3</button>
      </div>

      <div id="pane-faces" role="tabpanel" class="face-grid">
        <a class="face-card face-card-captured" href="#annotate/top">
          <img src="../../../fixtures/hinge_pin/top.jpg" alt="Top">
          <span class="face-card-check"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span class="face-card-scrim"><span class="face-card-label">Top</span><span class="face-card-meta">1600 × 1200 · 1 dim</span></span>
        </a>
        <a class="face-card face-card-captured" href="#annotate/side">
          <img src="../../../fixtures/hinge_pin/side.jpg" alt="Side">
          <span class="face-card-check"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span class="face-card-scrim"><span class="face-card-label">Side</span><span class="face-card-meta">1600 × 1200 · 0 dims</span></span>
        </a>
        <a class="face-card face-card-captured" href="#annotate/end">
          <img src="../../../fixtures/hinge_pin/end.jpg" alt="End">
          <span class="face-card-check"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span class="face-card-scrim"><span class="face-card-label">End</span><span class="face-card-meta">1200 × 1600 · 2 dims</span></span>
        </a>
        <a class="face-card face-card-empty" href="#capture">
          <svg class="i" viewBox="0 0 24 24"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>
          <span>Capture</span>
        </a>
      </div>

      <section id="pane-features" role="tabpanel" class="list-group-section" hidden>
        <div class="list-group">
          <div class="value-row">
            <span class="value-main"><span class="value-name"><span class="flag" aria-label="flagged"><svg class="i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>overall_l</span><span class="value-faces value-faces-multi">top · end</span></span>
            <span class="value-nums"><span class="value-val">42.18<span class="unit">mm</span></span><span class="value-tol">±0.10</span></span>
          </div>
          <div class="value-row">
            <span class="value-main"><span class="value-name">pin_dia</span><span class="value-faces">end</span></span>
            <span class="value-nums"><span class="value-val">⌀ 6.51<span class="unit">mm</span></span><span class="value-tol">±0.10</span></span>
          </div>
          <div class="value-row">
            <span class="value-main"><span class="value-name">hole_dia</span><span class="value-faces">top</span></span>
            <span class="value-nums"><span class="value-val">⌀ 3.02<span class="unit">mm</span></span><span class="value-tol">±0.10</span></span>
          </div>
        </div>
        <button class="warning-row" type="button">
          <span class="warning-row-icon"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
          <span class="warning-row-text">overall_l: top and end differ by 0.13 mm, outside ±0.10. Check before export.</span>
        </button>
      </section>
    </div>

    <div class="action-dock">
      <button class="btn btn-primary btn-block" type="button">Export</button>
    </div>
  </main>
</div></div></div>
<script>
  // Pane switch. Static mockup, so a few lines of JS rather than the app's TEA.
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const show = (id) => {
    tabs.forEach((t) => {
      const on = t.id === id;
      t.setAttribute('aria-pressed', on);
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
  };
  tabs.forEach((t) => t.addEventListener('click', () => show(t.id)));
  if (new URLSearchParams(location.search).get('pane') === 'features') show('tab-features');
</script>
</body>
</html>
