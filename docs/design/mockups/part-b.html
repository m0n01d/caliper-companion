<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Part · B · Hero + strip</title>
<!-- Mockup for docs/design/review-2026-09-17.md. Real app CSS + real fixture
     images; only the layout below is new. -->
<link rel="stylesheet" href="../../../src/theme.css">
<link rel="stylesheet" href="../../../src/global.css">
<style>
  /* ── Layout B: most-recent face as a hero, the rest as an 88 px strip ── */
  .section-gap { gap: var(--cc-space-6); }
  .faces { display: flex; flex-direction: column; gap: var(--cc-space-3); }

  .hero {
    position: relative; display: block;
    height: 268px;                                        /* 358 × 3/4; same rule as the annotate stage, cap 300 */
    border-radius: var(--cc-radius-photo);
    background: var(--cc-photo-mat);
    overflow: hidden; color: inherit; text-decoration: none; touch-action: manipulation;
  }
  .hero:active { opacity: 0.8; }
  .hero img { width: 100%; height: 100%; object-fit: contain; }   /* §8: letterbox, never crop */
  .hero .pill { position: absolute; }
  .hero-kind  { top: 12px; left: 12px; font: 600 var(--cc-size-subhead) / var(--cc-leading-subhead) var(--cc-font-ui); }
  .hero-kind .size { font: var(--cc-text-footnote); color: var(--cc-text-2); margin-left: 6px; }
  .hero-dims  { right: 12px; bottom: 12px; }
  .hero-open  { left: 12px; bottom: 12px; color: var(--cc-amber); }

  .strip { display: flex; gap: var(--cc-space-3); overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
  .strip::-webkit-scrollbar { display: none; }
  .strip-tile {
    position: relative; flex: 0 0 auto; width: 88px; height: 88px;
    border-radius: var(--cc-radius); background: var(--cc-surface-2); overflow: hidden;
    color: inherit; text-decoration: none; touch-action: manipulation;
  }
  .strip-tile:active { opacity: 0.6; }
  .strip-tile img { width: 100%; height: 100%; object-fit: cover; }
  .strip-tile-captured::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--cc-teal); border-radius: inherit; pointer-events: none; }
  .strip-label {
    position: absolute; left: 6px; bottom: 6px; padding: 2px 8px;
    border-radius: var(--cc-radius-capsule); background: var(--cc-scrim);
    font: 600 var(--cc-size-caption-1) / var(--cc-leading-caption-1) var(--cc-font-ui); text-transform: capitalize;
  }
  .strip-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: transparent; border: 2px dashed var(--cc-border); color: var(--cc-text-2);
    font: 600 var(--cc-size-caption-1) / var(--cc-leading-caption-1) var(--cc-font-ui);
  }
  .strip-empty svg { width: 22px; height: 22px; }

  /* ── Feature rows with large mono values (Title 2, 22/28) ─────────── */
  .value-row { display: flex; align-items: center; gap: var(--cc-space-3); padding: 12px 16px; min-height: 70px; }
  .value-row + .value-row { border-top: 1px solid var(--cc-border); margin-left: 16px; padding-left: 0; }
  .value-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .value-name { font: 500 var(--cc-size-body) / var(--cc-leading-body) var(--cc-font-mono); overflow-wrap: anywhere; }
  .value-faces { font: var(--cc-text-footnote); color: var(--cc-text-2); }
  .value-faces-multi { color: var(--cc-teal); }
  .value-nums { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
  .value-val { font: 400 22px / 28px var(--cc-font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .value-val .unit { font: var(--cc-text-subhead); color: var(--cc-text-2); margin-left: 4px; }
  .value-tol { font: 400 var(--cc-size-footnote) / var(--cc-leading-footnote) var(--cc-font-mono); color: var(--cc-text-2); }
  .flag { display: inline-flex; color: var(--cc-error); vertical-align: -3px; margin-right: 4px; }
  .flag svg { width: 16px; height: 16px; }

  /* ── Bottom action card ─────────────────────────────────────────────── */
  .action-card { display: flex; flex-direction: column; gap: var(--cc-space-3); padding: var(--cc-space-4); background: var(--cc-surface); border-radius: var(--cc-radius-card); }
  .action-meta { display: flex; justify-content: space-between; gap: var(--cc-space-3); font: var(--cc-text-footnote); color: var(--cc-text-2); }

  .bar-action { min-height: var(--cc-tap-min); padding: 0 var(--cc-space-2); background: transparent; border-color: transparent; color: var(--cc-amber); font: var(--cc-text-body); }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="root"><div class="app-frame"><div class="shell">
  <header class="shell-topbar">
    <div class="shell-topbar-leading">
      <button class="btn btn-icon shell-back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <div class="shell-topbar-center">
      <h1 class="shell-title">Norcold freezer hinge pin</h1>
      <p class="shell-subtitle">3 faces · 3 features · mm</p>
    </div>
    <div class="shell-topbar-actions"><button class="btn bar-action">Edit</button></div>
  </header>

  <main class="shell-content"><div class="stack-lg section-gap">

    <div class="faces">
      <a class="hero" href="#annotate/end" aria-label="End, 1200 by 1600, 2 dimensions. Open to annotate.">
        <img src="../../../fixtures/hinge_pin/end.jpg" alt="">
        <span class="pill hero-kind">End<span class="size">1200 × 1600</span></span>
        <span class="pill pill-mono hero-dims">2 dims</span>
        <span class="pill hero-open">Annotate ›</span>
      </a>
      <div class="strip">
        <a class="strip-tile strip-tile-captured" href="#annotate/top"><img src="../../../fixtures/hinge_pin/top.jpg" alt="Top"><span class="strip-label">Top</span></a>
        <a class="strip-tile strip-tile-captured" href="#annotate/side"><img src="../../../fixtures/hinge_pin/side.jpg" alt="Side"><span class="strip-label">Side</span></a>
        <a class="strip-tile strip-empty" href="#capture">
          <svg class="i" viewBox="0 0 24 24"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>
          <span>Capture</span>
        </a>
      </div>
    </div>

    <section class="list-group-section">
      <h2 class="list-group-header">Features</h2>
      <div class="list-group">
        <div class="value-row">
          <span class="value-main"><span class="value-name"><span class="flag" aria-label="flagged"><svg class="i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>overall_l</span><span class="value-faces value-faces-multi">top · end</span></span>
          <span class="value-nums"><span class="value-val">42.18<span class="unit">mm</span></span><span class="value-tol">±0.10</span></span>
        </div>
        <div class="value-row">
          <span class="value-main"><span class="value-name">pin_dia</span><span class="value-faces">end</span></span>
          <span class="value-nums"><span class="value-val">⌀ 6.51<span class="unit">mm</span></span><span class="value-tol">±0.10</span></span>
        </div>
        <div class="value-row">
          <span class="value-main"><span class="value-name">hole_dia</span><span class="value-faces">top</span></span>
          <span class="value-nums"><span class="value-val">⌀ 3.02<span class="unit">mm</span></span><span class="value-tol">±0.10</span></span>
        </div>
      </div>
      <button class="warning-row" type="button">
        <span class="warning-row-icon"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
        <span class="warning-row-text">overall_l: top and end differ by 0.13 mm, outside ±0.10. Check before export.</span>
      </button>
    </section>

    <div class="action-card">
      <button class="btn btn-primary btn-block" type="button">Export</button>
      <div class="action-meta"><span>3 features on 3 faces</span><span class="mono">Hands-on 3m 07s</span></div>
    </div>

  </div></main>
</div></div></div>
</body>
</html>
