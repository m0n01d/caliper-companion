<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Part · A · Gallery-first</title>
<!-- Mockup for docs/design/review-2026-09-17.md. Tokens, bar, capsules and
     the inset grouped list are the app's real CSS; only the layout below is
     new. Images are the real fixtures (end.jpg is EXIF 6 → renders portrait). -->
<link rel="stylesheet" href="../../../src/theme.css">
<link rel="stylesheet" href="../../../src/global.css">
<style>
  /* ── Layout A: 2-column Face-card grid ─────────────────────────────── */
  .section-gap { gap: var(--cc-space-6); }               /* 24 between sections */

  .face-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--cc-space-4);                              /* 16 → 171 px cards at 390 */
  }
  .face-card {
    position: relative;
    display: block;
    aspect-ratio: 1;
    border-radius: var(--cc-radius-card);
    background: var(--cc-surface-2);
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    touch-action: manipulation;
  }
  .face-card:active { opacity: 0.6; }
  .face-card img { width: 100%; height: 100%; object-fit: cover; }
  .face-card-captured::after {                          /* 2 px teal ring, inside */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 2px solid var(--cc-teal); border-radius: inherit;
  }
  .face-card-scrim {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; gap: 1px;
    padding: 36px 12px 10px;
    background: linear-gradient(to top, rgba(26, 27, 29, 0.94) 0 44px, rgba(26, 27, 29, 0));
  }
  .face-card-label { font: var(--cc-text-headline); text-transform: capitalize; }
  .face-card-meta  { font: var(--cc-text-caption-1); color: var(--cc-text-2); font-variant-numeric: tabular-nums; }
  .face-card-check {
    position: absolute; top: 10px; right: 10px;
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--cc-teal); color: var(--cc-ground);
  }
  .face-card-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--cc-space-2);
    background: transparent; border: 2px dashed var(--cc-border);
    color: var(--cc-text-2); font: 600 var(--cc-size-subhead) / var(--cc-leading-subhead) var(--cc-font-ui);
  }
  .face-card-empty svg { width: 28px; height: 28px; }

  /* ── Features table, fixed: 3 columns, faces under the name; no column
     header row (the group header + units carry the meaning, as in HIG lists) ── */
  .features-table { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; width: 100%; }
  .features-table thead, .features-table tbody, .features-table tr { display: contents; }
  .features-table th, .features-table td {
    min-width: 0; padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--cc-border);
  }
  .features-table th:first-child, .features-table td:first-child { padding-left: var(--cc-space-4); }
  .features-table th:last-child,  .features-table td:last-child  { padding-right: var(--cc-space-4); }
  .features-table tr:last-child td { border-bottom: 0; }
  .features-table th {
    padding-top: 10px; padding-bottom: 8px;
    font: 600 var(--cc-size-caption-1) / var(--cc-leading-caption-1) var(--cc-font-ui);
    color: var(--cc-text-2); text-transform: uppercase; letter-spacing: 0.04em;
  }
  .features-table td { font: var(--cc-text-body); vertical-align: top; }
  .features-table td.mono { font-family: var(--cc-font-mono); font-variant-numeric: tabular-nums; }
  .features-table .num { text-align: right; white-space: nowrap; }
  .feat-name { display: flex; flex-direction: column; gap: 2px; }
  .feat-name .name { overflow-wrap: anywhere; }
  .feat-faces { font: var(--cc-text-footnote); color: var(--cc-text-2); font-family: var(--cc-font-ui); }
  .feat-faces-multi { color: var(--cc-teal); }
  .unit { font: var(--cc-text-footnote); color: var(--cc-text-2); margin-left: 3px; }
  .tol { font: 400 var(--cc-size-footnote) / var(--cc-leading-body) var(--cc-font-mono); color: var(--cc-text-2); }
  .flag { display: inline-flex; color: var(--cc-error); vertical-align: -3px; margin-right: 4px; }
  .flag svg { width: 16px; height: 16px; }

  .bar-action {                                          /* HIG trailing text action */
    min-height: var(--cc-tap-min); padding: 0 var(--cc-space-2);
    background: transparent; border-color: transparent; color: var(--cc-amber);
    font: var(--cc-text-body);
  }
  .timer { text-align: center; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="root"><div class="app-frame"><div class="shell">
  <header class="shell-topbar">
    <div class="shell-topbar-leading">
      <button class="btn btn-icon shell-back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <div class="shell-topbar-center">
      <h1 class="shell-title">Norcold freezer hinge pin</h1>
      <p class="shell-subtitle">3 faces · 3 features · mm</p>
    </div>
    <div class="shell-topbar-actions"><button class="btn bar-action">Edit</button></div>
  </header>

  <main class="shell-content"><div class="stack-lg section-gap">

    <div class="face-grid">
      <a class="face-card face-card-captured" href="#annotate/top">
        <img src="../../../fixtures/hinge_pin/top.jpg" alt="Top">
        <span class="face-card-check"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span class="face-card-scrim"><span class="face-card-label">Top</span><span class="face-card-meta">1600 × 1200 · 1 dim</span></span>
      </a>
      <a class="face-card face-card-captured" href="#annotate/side">
        <img src="../../../fixtures/hinge_pin/side.jpg" alt="Side">
        <span class="face-card-check"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span class="face-card-scrim"><span class="face-card-label">Side</span><span class="face-card-meta">1600 × 1200 · 0 dims</span></span>
      </a>
      <a class="face-card face-card-captured" href="#annotate/end">
        <img src="../../../fixtures/hinge_pin/end.jpg" alt="End">
        <span class="face-card-check"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span class="face-card-scrim"><span class="face-card-label">End</span><span class="face-card-meta">1200 × 1600 · 2 dims</span></span>
      </a>
      <a class="face-card face-card-empty" href="#capture">
        <svg class="i" viewBox="0 0 24 24"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>
        <span>Capture</span>
      </a>
    </div>

    <section class="list-group-section">
      <h2 class="list-group-header">Features</h2>
      <div class="list-group">
        <table class="features-table" role="table">
          <tbody>
            <tr>
              <td class="mono"><span class="feat-name"><span class="name"><span class="flag" aria-label="flagged"><svg class="i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>overall_l</span><span class="feat-faces feat-faces-multi">top · end</span></span></td>
              <td class="num mono">42.18<span class="unit">mm</span></td>
              <td class="num"><span class="tol">±0.10</span></td>
            </tr>
            <tr>
              <td class="mono"><span class="feat-name"><span class="name">pin_dia</span><span class="feat-faces">end</span></span></td>
              <td class="num mono">⌀ 6.51<span class="unit">mm</span></td>
              <td class="num"><span class="tol">±0.10</span></td>
            </tr>
            <tr>
              <td class="mono"><span class="feat-name"><span class="name">hole_dia</span><span class="feat-faces">top</span></span></td>
              <td class="num mono">⌀ 3.02<span class="unit">mm</span></td>
              <td class="num"><span class="tol">±0.10</span></td>
            </tr>
          </tbody>
        </table>
      </div>
      <button class="warning-row" type="button">
        <span class="warning-row-icon"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
        <span class="warning-row-text">overall_l: top and end differ by 0.13 mm, outside ±0.10. Check before export.</span>
      </button>
    </section>

    <div class="stack">
      <button class="btn btn-primary btn-block" type="button">Export</button>
      <p class="t-footnote mono muted timer">Hands-on 3m 07s</p>
    </div>

  </div></main>
</div></div></div>
</body>
</html>
